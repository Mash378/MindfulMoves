name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          # Cache uv's downladed package cache
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        # Installs everything pinned in backend/uv.lock into a fresh venv
        run: uv sync

      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET_KEY: test-secret-key
          FRONTEND_URL: http://localhost:5173
        run: uv run python -m pytest tests/ -m "not system"